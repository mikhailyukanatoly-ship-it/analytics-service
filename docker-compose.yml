services:
  postgres:
    container_name: postgres
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - analytics-service-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm migration:run:prod
    container_name: analytics-service-migration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
    networks:
      - analytics-service-network
    restart: "no"

  data-import:
    build:
      context: .
      dockerfile: Dockerfile
    command: node dist/data-import/data-import.command.js
    container_name: analytics-service-data-import
    depends_on:
      app:
        condition: service_healthy
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
    networks:
      - analytics-service-network
    restart: "no"

  app:
    container_name: analytics-service-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:3001/api/analytics/leaderboard?limit=1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_HOST=postgres
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - analytics-service-network
    volumes:
      - transformers-cache:/root/.cache/huggingface

volumes:
  postgres_data:
  transformers-cache:

networks:
  analytics-service-network:
    driver: bridge
